","觀國之光，利用賓於王。"],["九五","觀我生，君子無咎。"],["上九","觀其生，君子無咎。"]],"mod":["像小孩一樣幼稚地觀察，小人無妨，君子就不好。","從門縫偷看，眼界太窄。","觀察自己的言行，決定進退。","觀察國家的光輝，適合去當貴賓、求取功名。","觀察自己的作為，君子沒有過錯。","觀察別人的作為，君子沒有過錯。"]},{"n":21,"name":"噬嗑","full":"火雷噬嗑","sym":"䷔","a":"100101","up":"離","lo":"震","ci":"亨，利用獄。","xiang":"雷電，噬嗑。先王以明罰敕法。","lv":"平","fort":"有阻礙卡在中間，需要果斷處理、明辨是非。","love":"有第三者或誤會阻隔，需要說清楚。","work":"適合處理糾紛、法律事務。","adv":"咬斷阻礙，賞罰分明。","lines":[["初九","屨校滅趾，無咎。"],["六二","噬膚滅鼻，無咎。"],["六三","噬臘肉，遇毒；小吝，無咎。"],["九四","噬乾胏，得金矢；利艱貞，吉。"],["六五","噬乾肉，得黃金，貞厲，無咎。"],["上九","何校滅耳，凶。"]],"mod":["腳上戴刑具，傷到腳趾，小懲大戒，沒有過錯。","咬到柔軟的肉，鼻子都陷進去了，有點過頭但無過錯。","咬到臘肉遇到毒，有小遺憾，沒有大過錯。","咬到帶骨的乾肉，得到金屬箭頭，艱難中守正吉利。","咬到乾肉得到黃金，守正防危，沒有過錯。","脖子戴著刑具遮住耳朵，聽不進勸告，凶。"]},{"n":22,"name":"賁","full":"山火賁","sym":"䷕","a":"101001","up":"艮","lo":"離","ci":"亨，小利有攸往。","xiang":"山下有火，賁。君子以明庶政，無敢折獄。","lv":"平","fort":"重視外在修飾與美感，但本質更重要。","love":"外表吸引，但要看內在是否合得來。","work":"包裝與形象有助益，小事可成。","adv":"文質彬彬，不要只重外表。","lines":[["初九","賁其趾，舍車而徒。"],["六二","賁其須。"],["九三","賁如，濡如，永貞吉。"],["六四","賁如，皤如，白馬翰如，匪寇，婚媾。"],["六五","賁於丘園，束帛戔戔；吝，終吉。"],["上九","白賁，無咎。"]],"mod":["裝飾自己的腳趾，捨棄車子而步行，安守本分。","修飾自己的鬍鬚，跟隨上位者行動。","裝飾得光鮮亮麗，長久守正吉利。","素白的裝飾，騎著白馬飛奔，不是強盜而是來求婚的。","裝飾山丘園林，禮物雖少，雖有遺憾最終吉利。","用素白作裝飾，返璞歸真，沒有過錯。"]},{"n":23,"name":"剝","full":"山地剝","sym":"䷖","a":"000001","up":"艮","lo":"坤","ci":"不利有攸往。","xiang":"山附於地，剝。上以厚下安宅。","lv":"小心","fort":"處於消耗剝落的階段，不宜冒進，先保存實力。","love":"關係可能走下坡，需要修補基礎。","work":"運勢較弱，守成為上，不宜擴張。","adv":"順勢而止，剝極必復。","lines":[["初六","剝床以足，蔑貞；凶。"],["六二","剝床以辨，蔑貞凶。"],["六三","剝之，無咎。"],["六四","剝床以膚，凶。"],["六五","貫魚以宮人寵，無不利。"],["上九","碩果不食，君子得輿，小人剝廬。"]],"mod":["床腳開始損壞，問題從根基萌芽，要及早處理。","床板邊緣也壞了，情況惡化，要小心。","雖處剝落之中卻能脫離小人，沒有過錯。","損及床面、傷到皮膚，凶。","像魚串一樣帶領眾人，得到寵愛，無往不利。","碩大的果實沒被吃掉，君子得到車子，小人房子被拆。"]},{"n":24,"name":"復","full":"地雷復","sym":"䷗","a":"100000","up":"坤","lo":"震","ci":"亨。出入無疾，朋來無咎。反覆其道，七日來複，利有攸往。","xiang":"雷在地中，復。先王以至日閉關，商旅不行，后不省方。","lv":"吉","fort":"一陽來復，低潮結束，好運正在回來。","love":"有復合或重新開始的機會。","work":"事業回升，適合重新出發。","adv":"從小處重新開始，循序漸進。","lines":[["初九","不遠復，無祗悔，元吉。"],["六二","休復，吉。"],["六三","頻復，厲無咎。"],["六四","中行獨復。"],["六五" ","田獵卻沒有獵物，方向錯了。","保持恆久的德行，對女子吉，對男子凶（要懂得變通）。","動搖不定、無法持恆，凶。"]},{"n":33,"name":"遯","full":"天山遯","sym":"䷠","a":"001111","up":"乾","lo":"艮","ci":"亨，小利貞。","xiang":"天下有山，遁。君子以遠小人，不惡而嚴。","lv":"平","fort":"小人得勢，宜退避保身，以退為進。","love":"暫時保持距離，冷靜一下。","work":"適合暫時退出、轉換跑道。","adv":"知所進退，退而不失其志。","lines":[["初六","遁尾，厲，勿用有攸往。"],["六二","執之用黃牛之革，莫之勝說。"],["九三","係遁，有疾厲；畜臣妾，吉。"],["九四","好遁，君子吉，小人否。"],["九五","嘉遁，貞吉。"],["上九","肥遁，無不利。"]],"mod":["退在最後，有危險，不宜有所行動。","用黃牛皮綁住，意志堅定不動搖。","被牽絆而無法退避，有危險，蓄養僕妾吉。","好好退隱，君子吉，小人做不到。","完美的退隱，守正吉利。","從容的退隱，無往不利。"]},{"n":34,"name":"大壯","full":"雷天大壯","sym":"䷡","a":"111100","up":"震","lo":"乾","ci":"利貞。","xiang":"雷在天上，大壯。君子以非禮弗履。","lv":"吉","fort":"氣勢強盛，但要守正，不可恃強凌弱。","love":"熱情強烈，注意別太霸道。","work":"實力強盛，正當行事可成功。","adv":"強而守正，不逞匹夫之勇。","lines":[["初九","壯於趾，征凶，有孚。"],["九二","貞吉。"],["九三","小人用壯，君子用罔；貞厲。羝羊觸藩，羸其角。"],["九四","貞吉，悔亡；藩決不羸，壯於大輿之輹。"],["六五","喪羊於易，無悔。"],["上六","羝羊觸藩，不能退，不能遂，無攸利；艱則吉。"]],"mod":["腳趾強壯就急著前進，凶。","守正吉利。","小人逞強，君子不這樣做；像公羊撞籬笆卡住了角。","籬笆撞開了，角不再卡住，強壯得像大車的車輪。","在田邊失去了羊，沒有悔恨。","公羊撞籬笆，進退不得，艱難中堅持才吉。"]},{"n":35,"name":"晉","full":"火地晉","sym":"䷢","a":"000101","up":"離","lo":"坤","ci":"康侯用錫馬蕃庶，晝日三接。","xiang":"明出地上，晉。君子以自昭明德。","lv":"大吉","fort":"如旭日東昇，步步高升，受到賞識。","love":"魅力增加，容易受到青睞。","work":"受到重用、升遷加薪。","adv":"把握機會，謙虛自昭明德。","lines":[["初六","晉如摧如，貞吉。罔孚，裕無咎。"],["六二","晉如愁如，貞吉，受茲介福，於其王母。"],["六三","眾允，悔亡。"],["九四","晉如鼫鼠，貞厲。"],["六五","悔亡，失得勿恤，往吉，無不利。"],["上九","晉其角，維用伐邑，厲吉無咎。貞吝。"]],"mod":["前進受阻，守正吉利；不被信任也要寬裕以待。","前進時憂愁，守正吉利，會得到長輩的福澤。","得到眾人信任與支持，原本的顧慮或懊悔會消失。","像大老鼠一樣貪婪前進，守正也有危險。","悔恨消失，不必在意得失，前往吉利。","用角前進，只宜整頓自己，雖危險但吉。"]},{"n":36,"name":"明夷","full":"地火明夷","sym":"䷣","a":"101000","up":"坤","lo":"離","ci":"利艱貞。","xiang":"明入地中，明夷。君子以蒞眾，用晦而明。","lv":"小心","fort":"光明受傷，處境不利，要韜光養晦。","love":"感情受委屈，先保護自己。","work":"職場遭受打壓，低調保身。","adv":"外柔內明，忍耐等待天亮。","lines":[["初九","明夷于飛，垂其翼；君子於行，三日不食。有攸往，主人有言。"],["六二","明夷，夷於左股，用拯馬壯，吉。"],["九三","明夷於南狩，得其大首。不可疾貞。"],["六四","入於左腹，獲明夷之心，於出門庭。"],["六五","箕子之明夷，利貞。"],["上六","不明晦，初登於天，後入於地。"]],"mod":["光明受傷時趕快飛走，三天吃不上飯，仍有話柄。","傷到左腿，用強壯的馬來救，吉利。","在南方狩獵，抓到首惡，但不可操之過急。","進入黑暗的核心，了解真相後離開。","像箕子一樣裝傻韜晦，守正有利。","不明而晦暗，先登上天，後墜入地。"]},{"n":37,"name":"家人","full":"風火家人","sym":"䷤","a":"101011","up":"巽","lo":"離","ci":"利女貞。","xiang":"風自火出，家人。君子以言有物而行有恆。","lv":"吉","fort":"家庭和樂，各盡其責，內部穩定就能順利。","love":"重視家庭，適合穩定的關係與婚姻。","work":"團隊各司其職，內部管理很重要。","adv":"正家而天下定，從身邊做起。","lines":[["初九","閒有家，悔亡。"],["六二","無攸遂，在中饋，貞吉。"],["九三","家人嗃嗃，悔厲，吉；婦子嘻嘻，終吝。"],["六四","富家，大吉。"],["九五","王假有家，勿恤，吉。"],["上九","有孚，威如，終吉。"]],"mod":["從一開始就立好家規，悔恨消失。","不擅作主張，在家中負責飲食，守正吉利。","治家太嚴有悔有危但吉；太放縱最後會有羞辱。","使家庭富裕，大吉。","君王以德感化家庭，不必憂慮，吉利。","有誠信又有威嚴，最後吉利。"]},{"n":38,"name":"睽","full":"火澤睽","sym":"䷥","a":"110101","up":"離","lo":"兌","ci":"小事吉。","xiang":"上火下澤，睽；君子以同而異。","lv":"平","fort":"意見分歧、彼此背離，但小事仍可成。","love":"想法不同、容易誤會，求同存異。","work":"合作有隔閡，從小處建立共識。","adv":"求同存異，化解誤會。","lines":[["初九","悔亡；喪馬勿逐，自復；見惡人，無咎。"],["九二","遇主於巷，無咎。"],["六三","見輿曳，其牛掣；其人天且劓。無初有終。"],["九四","睽孤，遇元夫，交孚，厲無咎。"],["六五","悔亡，厥宗噬膚，往何咎？"],["上九","睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧；匪寇婚媾，往遇雨則吉。"]],"mod":["悔恨消失，走失的馬不必追，自己會回來。","在小巷遇到主人，沒有過錯。","看到車子被拖住、人被刑罰，開頭不好結局卻好。","背離孤獨，遇到好人，互相信任，雖危無過錯。","悔恨消失，同宗親人相聚，前往有什麼過錯？","疑心生暗鬼，誤會解開後，像遇雨一樣吉利。"]},{"n":39,"name":"蹇","full":"水山蹇","sym":"䷦","a":"001010","up":"坎","lo":"艮","ci":"利西南，不利東北；利見大人，貞吉。","xiang":"山上有水，蹇。君子以反身修德。","lv":"小心","fort":"前有險阻，行路艱難，宜停下反省、尋求協助。","love":"關係卡關，先檢討自己。","work":"進展困難，找貴人幫忙。","adv":"知難而止，反求諸己。","lines":[["初六","往蹇，來譽。"],["六二","王臣蹇蹇，匪躬之故。"],["九三","往蹇，來反。"],["六四","往蹇，來連。"],["九五","大蹇，朋來。"],["上六","往蹇，來碩；吉，利見大人。"]],"mod":["前往艱難，回來會受讚譽。","臣子為了國事奔波勞苦，不是為了自己。","前往艱難，不如回頭。","前往艱難，回來與人聯合。","在大難中，朋友前來相助。","前往艱難，回來會有大收穫，吉利，宜見貴人。"]},{"n":40,"name":"解","full":"雷水解","sym":"䷧","a":"010100","up":"震","lo":"坎","ci":"利西南。無所往，其來複吉。有攸往，夙吉。","xiang":"雷雨作，解。君子以赦過宥罪。","lv":"吉","fort":"困難解除，問題得到化解，宜寬容饒恕。","love":"誤會化解，關係重新順暢。","work":"難題解決，可以重新出發。","adv":"及時處理，寬以待人。","lines":[["初六","無咎。"],["九二","田獲三狐，得黃矢；貞吉。"],["六三","負且乘，致寇至，貞吝。"],["九四","解而拇，朋至斯孚。"],["六五","君子維有解，吉，有孚於小人。"],["上六","公用射隼於高墉之上，獲之，無不利。"]],"mod":["沒有過錯。","田獵得到三隻狐狸和黃色箭矢，守正吉利。","背著東西又坐車，招來強盜，守正也有遺憾。","解開腳拇趾的束縛，朋友才會真心前來。","君子能解除困難，吉利，用誠信感化小人。","在高牆上射中惡鳥，無往不利。"]},{"n":41,"name":"損","full":"山澤損","sym":"䷨","a":"110001","up":"艮","lo":"兌","ci":"有孚，元吉，無咎，可貞，利有攸往。曷之用？二簋可用享。","xiang":"山下有澤，損。君子以懲忿窒欲。","lv":"平","fort":"有所減損，但減損是為了更大的收穫。","love":"付出與犧牲，真心換真心。","work":"先投入成本，日後才有回報。","adv":"損下益上要適度，懲忿窒欲。","lines":[["初九","已事遄往，無咎；酌損之。"],["九二","利貞，征凶；弗損益之。"],["六三","三人行，則損一人；一人行，則得其友。"],["六四","損其疾，使遄有喜，無咎。"],["六五","或益之十朋之龜，弗克違，元吉。"],["上九","弗損益之，無咎。貞吉，利有攸往，得臣無家。"]],"mod":["完成事情趕快去幫忙，沒有過錯，但要斟酌減損。","守正有利，冒進凶；不減損自己也能幫助別人。","三人同行會少一人，一人獨行會得到朋友。","減輕自己的毛病，盡快改善會有喜事。","有人送來價值連城的寶龜，推辭不了，大吉。","不減損自己也能幫助別人，守正吉利，會得到眾人擁護。"]},{"n":42,"name":"益","full":"風雷益","sym":"䷩","a":"100011","up":"巽","lo":"震","ci":"利有攸往，利涉大川。","xiang":"風雷，益。君子以見善則遷，有過則改。","lv":"大吉","fort":"得到增益，正是做大事的好時機。","love":"感情增溫，互相成長。","work":"有貴人相助，適合擴展投資。","adv":"見善則遷，有過則改。","lines":[["初九","利用為大作，元吉，無咎。"],["六二","或益之十朋之龜，弗克違。永貞吉；王用享於帝，吉。"],["六三","益之用凶事，無咎；有孚中行，告公用圭。"],["六四","中行，告公從，利用為依遷國。"],["九五","有孚惠心，勿問元吉。有孚惠我德。"],["上九","莫益之，或擊之，立心勿恆，凶。"]],"mod":["適合做大事，大吉，沒有過錯。","有人送來寶龜，推辭不了，長久守正吉利。","在凶險的事中得到增益，以誠信行事無過錯。","依中道行事，上位者會聽從你的建議。","有誠心助人，不必問也是大吉。","沒有人幫助他，反而有人攻擊他，心意不定，凶。"]},{"n":43,"name":"夬","full":"澤天夬","sym":"䷪","a":"111110","up":"兌","lo":"乾","ci":"揚於王庭，孚號有厲；告自邑，不利即戎，利有攸往。","xiang":"澤上於天，夬。君子以施祿及下，居德則忌。","lv":"平","fort":"決斷的時刻，果斷除去小人或壞習慣。","love":"需要坦白說清楚，做出決定。","work":"果斷處理問題，但要講方法。","adv":"決而能和，不可意氣用事。","lines":[["初九","壯於前趾，往不勝為咎。"],["九二","惕號，莫夜有戎，勿恤。"],["九三","壯於頄，有凶。君子夬夬獨行，遇雨若濡，有慍無咎。"],["九四","臀無膚，其行次且；牽羊悔亡，聞言不信。"],["九五","莧陸夬夬，中行無咎。"],["上六","無號，終有凶。"]],"mod":["腳趾強壯就急著前進，去了不能勝，反成過錯。","保持警惕，夜裡有敵人也不必擔心。","臉上顯露怒氣會凶，君子果斷獨行，雖受委屈但無過錯。","臀部沒了皮膚，行動困難，聽不進勸告。","像拔除莧菜一樣果斷，守中道沒有過錯。","沒有人發出警告，最後有凶。"]},{"n":44,"name":"姤","full":"天風姤","sym":"䷫","a":"011111","up":"乾","lo":"巽","ci":"女壯，勿用取女。","xiang":"天下有風，姤。后以施命誥四方。","lv":"小心","fort":"不期而遇，留意誘惑或突然出現的人事。","love":"易有邂逅，但要看清楚對方。","work":"出現新機會，但要防範小人。","adv":"防微杜漸，不被誘惑。","lines":[["初六","繫於金柅，貞吉；有攸往，見凶，羸豕孚躑躅。"],["九二","包有魚，無咎，不利賓。"],["九三","臀無膚，其行次且；厲，無大咎。"],["九四","包無魚，起凶。"],["九五","以杞包瓜，含章，有隕自天。"],["上九","姤其角，吝，無咎。"]],"mod":["用金屬煞車把車停住，守正吉利；放任前進就凶。","廚房裡有魚，沒有過錯，但不要拿去 let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}
const mod=(n,m)=>{const r=n%m;return r===0?m:r};

/* vals: array of 6 numbers bottom->top, each 6/7/8/9 */
function hexOf(vals,changed){return BYA[vals.map(v=>{let y=(v===7||v===9)?1:0;if(changed&&(v===6||v===9))y=1-y;return y}).join('')]}
function barHTML(yang,mv,mk){return `<div class="bar ${mv?'mv':''}">${yang?'<i></i>':'<i></i><i></i>'}${mk?`<span class="mk">${mk}</span>`:''}</div>`}

/* ---------- state ---------- */
const S={q:'',method:'coin',coin:[],last:null,sur:'',giv:'',adj:{},n1:'',n2:'',res:null};

/* ---------- views ---------- */
const V=$('#v-cast');
function render(){
  if(S.res)return renderResult();
  const M=S.method;
  V.innerHTML=`
  <section class="panel">
    <div class="lab">想問的事<small>可以留白，看整體運勢</small></div>
    <textarea id="q" rows="2" maxlength="80" placeholder="例如：這份工作值得繼續做下去嗎？">${esc(S.q)}</textarea>
    <div class="chips">${['最近整體運勢如何？','這段感情會怎麼發展？','現在適合換工作嗎？','這個計畫能成功嗎？'].map(s=>`<button data-act="sugg" data-v="${s}">${s}</button>`).join('')}</div>
  </section>
  <section class="panel">
    <div class="seg" role="tablist">
      ${[['coin','擲銅錢','傳統三錢法'],['name','姓名起卦','梅花易數'],['num','數字起卦','心中想兩個數']].map(([k,a,b])=>`<button role="tab" data-act="method" data-v="${k}" aria-selected="${M===k}">${a}<small>${b}</small></button>`).join('')}
    </div>
    <div id="mbody">${M==='coin'?coinHTML():M==='name'?nameHTML():numHTML()}</div>
  </section>`;
  $('#q').addEventListener('input',e=>S.q=e.target.value);
  bindMethod();
}
function coinHTML(){
  const n=S.coin.length,l=S.last;
  return `<p class="howto">心裡默想你的問題，連續擲 6 次。每次三枚銅錢，從最下面的「初爻」往上排出一個卦。</p>
  <div class="toss">
    <div class="tossbtns">
      <div class="coins" id="coins">${[0,1,2].map(i=>{const c=l?l[i]:3;return `<div class="coin ${c===2?'yin':''}"><span>${c===3?'陽':'陰'}</span></div>`}).join('')}</div>
      <button class="btn" data-act="toss" ${n>=6?'hidden':''}>擲第 ${n+1} 次</button>
      ${n>=6?'<button class="btn" data-act="cast-coin">看卦象</button>':''}
      ${n>0&&n<6?'<button class="link" data-act="toss-all">剩下的一次擲完</button>':''}
      ${n>0?'<button class="link" data-act="reset-coin">重新開始</button>':''}
    </div>
    <div class="rows">${[0,1,2,3,4,5].map(i=>{const v=S.coin[i];if(v==null)return `<div class="row empty"><span class="pos">${POS[i]}爻</span>${barHTML(1)}<span></span></div>`;
      const [nm,mk,mv]=VAL[v];return `<div class="row"><span class="pos">${POS[i]}爻</span>${barHTML(v%2,mv)}<span class="tag ${mv?'mv':''}">${nm}${mv?' 會變':''}</span></div>`}).join('')}</div>
  </div>`;
}
function nameChars(){return (S.sur+S.giv).split('').filter(c=>/\S/.test(c))}
function strokeOf(c,i){return S.adj[i]!=null?S.adj[i]:(NUMFIX[c]??SK[c]??0)}
function nameCalc(){
  const sur=[...S.sur.trim()],giv=[...S.giv.trim()],all=[...sur,...giv];
  const st=all.map((c,i)=>strokeOf(c,i));
  const a=st.slice(0,sur.length).reduce((x,y)=>x+y,0),b=st.slice(sur.length).reduce((x,y)=>x+y,0);
  return {sur,giv,all,st,a,b,ok:sur.length&&giv.length&&st.every(x=>x>0)};
}
function nameHTML(){
  const c=nameCalc();
  return `<p class="howto">用姓名的康熙字典筆畫起卦：姓的筆畫定上卦，名的筆畫定下卦，總筆畫定哪一爻會變。所以同姓、名字筆畫加起來一樣的人，會得到同一卦。</p>
  <div class="namegrid"><div><div class="lab">姓</div><input type="text" id="sur" maxlength="2" placeholder="王" value="${esc(S.sur)}" autocomplete="off"></div>
  <div><div class="lab">名</div><input type="text" id="giv" maxlength="3" placeholder="小美" value="${esc(S.giv)}" autocomplete="off"></div></div>
  <div id="namecalc">${nameCalcHTML(c)}</div>`;
}
function nameCalcHTML(c){
  if(!c.all.length)return '';
  const unk=c.st.some(x=>!x);
  let h=`<div class="strokes">${c.all.map((ch,i)=>`<div class="sk ${S.adj[i]!=null?'edited':''} ${!c.st[i]?'unknown':''}"><b>${esc(ch)}</b><button data-act="sk" data-i="${i}" data-d="-1" aria-label="減一畫">−</button><span class="n">${c.st[i]||'?'}<small>畫</small></span><button data-act="sk" data-i="${i}" data-d="1" aria-label="加一畫">＋</button></div>`).join('')}</div>`;
  const notes=c.all.map((ch,i)=>{const r=RADINFO[RAD[ch]];return r&&S.adj[i]==null?`「${esc(ch)}」的部首 ${r[0]===r[1]?r[1]:r[0]+' 原字是「'+r[1]+'」'}，算 ${r[2]} 畫`:''}).filter(Boolean);
  if(notes.length)h+=`<div class="kx"><b>為什麼跟平常寫的筆畫不一樣？</b>姓名起卦傳統上用康熙字典筆畫，部首要照原本的字來算：${notes.join('；')}。</div>`;
  if(unk)h+=`<div class="formula">有字查不到筆畫，請用 ＋ 手動補上。</div>`;
  else if(c.ok){const total=c.a+c.b,u=mod(c.a,8),l=mod(c.b,8),m=mod(total,6);
    h+=`<div class="formula">姓 <b>${c.a}</b> 畫 ÷ 8 餘 ${u} → 上卦 <b>${TRI[u][0]}（${TRI[u][1]}）</b><br>名 <b>${c.b}</b> 畫 ÷ 8 餘 ${l} → 下卦 <b>${TRI[l][0]}（${TRI[l][1]}）</b><br>總 <b>${total}</b> 畫 ÷ 6 餘 ${m} → 第 <b>${m}</b> 爻動<br><span style="font-size:12px">想用其他筆畫算法，可以用 ＋ − 自行調整。</span></div>`}
  return h+`<div class="center"><button class="btn" data-act="cast-name" ${c.ok?'':'disabled'}>起卦</button></div>`;
}
function numHTML(){
  return `<p class="howto">靜下心，憑直覺想兩個數字（1–999）。第一個數定上卦，第二個數定下卦，兩數相加定哪一爻會變。</p>
  <div class="nums"><div><label for="n1">第一個數</label><input type="number" id="n1" min="1" max="999" inputmode="numeric" placeholder="例如 7" value="${esc(S.n1)}"></div>
  <div><label for="n2">第二個數</label><input type="number" id="n2" min="1" max="999" inputmode="numeric" placeholder="例如 23" value="${esc(S.n2)}"></div>
  <button class="btn ghost sm" data-act="numrand">隨機</button></div>
  <div class="center"><button class="btn" data-act="cast-num" id="castnum" ${valid2()?'':'disabled'}>起卦</button></div>`;
}
const valid2=()=>+S.n1>=1&&+S.n2>=1&&+S.n1<=999&&+S.n2<=999;
function bindMethod(){
  if(S.method==='name'){
    const upd=()=>{$('#namecalc').innerHTML=nameCalcHTML(nameCalc())};
    $('#sur').addEventListener('input',e=>{S.sur=e.target.value.trim();S.adj={};upd()});
    $('#giv').addEventListener('input',e=>{S.giv=e.target.value.trim();S.adj={};upd()});
  }
  if(S.method==='num'){
    ['n1','n2'].forEach(k=>$('#'+k).addEventListener('input',e=>{S[k]=e.target.value;$('#castnum').disabled=!valid2()}));
  }
}
function tossOnce(){const c=[0,1,2].map(()=>rnd(2)?3:2);S.last=c;S.coin.push(c.reduce((a,b)=>a+b,0))}

/* from trigram numbers (梅花) to vals */
function meihua(u,l,m){
  const bits=(TRI[l][2]+TRI[u][2]).split('').map(Number);
  return bits.map((b,i)=>i===m-1?(b?9:6):(b?7:8));
}

/* ---------- reading rules (朱熹《易學啟蒙》) ---------- */
function keyReading(vals){
  const ben=hexOf(vals),bian=hexOf(vals,true),mv=vals.map((v,i)=>(v===6||v===9)?i:-1).filter(i=>i>=0),n=mv.length;
  const line=(h,i)=>({src:h.lines[i][0]+'　'+h.lines[i][1],tag:`${h.name}卦`,gl:h.mod[i]});
  const ci=(h,t)=>({src:h.ci,tag:`${h.name}卦卦辭`+(t?`・${t}`:''),gl:h.fort});
  if(n===0)return {why:'六爻都不變',hint:'看本卦的卦辭',items:[ci(ben)]};
  if(n===1)return {why:`只有${POS[mv[0]]}爻在變`,hint:'看本卦這一爻的爻辭',items:[line(ben,mv[0])]};
  if(n===2)return {why:'有兩爻在變',hint:'看本卦這兩爻，以上面那一爻為主',items:[line(ben,mv[1]),line(ben,mv[0])]};
  if(n===3)return {why:'有三爻在變',hint:'本卦和變卦的卦辭一起看，以本卦為主',items:[ci(ben,'為主'),ci(bian,'參考')]};
  const still=[0,1,2,3,4,5].filter(i=>!mv.includes(i));
  if(n===4)return {why:'有四爻在變',hint:'看變卦裡沒變的兩爻，以下面那一爻為主',items:[line(bian,still[0]),line(bian,still[1])]};
  if(n===5)return {why:'有五爻在變',hint:'看變卦裡唯一沒變的那一爻',items:[line(bian,still[0])]};
  if(ben.n===1||ben.n===2)return {why:'六爻全變',hint:ben.n===1?'乾卦看「用九」':'坤卦看「用六」',items:[{src:ben.lines[6][0]+'　'+ben.lines[6][1],tag:ben.name+'卦',gl:ben.mod[6]}]};
  return {why:'六爻全變',hint:'看變卦的卦辭',items:[ci(bian)]};
}

function cast(vals,method,detail){
  S.res={t:Date.now(),q:S.q.trim(),method,detail,vals};
  const h=store.get('iching-history',[]);h.unshift(S.res);store.set('iching-history',h.slice(0,50));
  render();window.scrollTo({top:0,behavior:'smooth'});
}
const MNAME={coin:'擲銅錢',name:'姓名起卦',num:'數字起卦'};

function hexBlock(h,vals,kind,isBen){
  return `<div class="hx"><div class="k">${kind}</div>
   <div class="lines">${h.a.split('').map((y,i)=>{const v=vals[i],mv=isBen&&(v===6||v===9);return `<div>${barHTML(+y,mv,mv?VAL[v][1]:'')}</div>`}).join('')}</div>
   <div><div class="nm">${h.name}</div><div class="fn">${h.full}・第${h.n}卦</div></div><span class="lv lv-${h.lv}">${h.lv}</span></div>`;
}
function renderResult(){
  const r=S.res,vals=r.vals,ben=hexOf(vals),bian=hexOf(vals,true),mv=vals.some(v=>v===6||v===9),k=keyReading(vals);
  const mvSet=vals.map(v=>v===6||v===9);
  V.innerHTML=`<section class="panel">
   <div class="res-q">${r.q?esc(r.q):'整體運勢'}</div>
   <div class="res-meta">${MNAME[r.method]}${r.detail?'・'+esc(r.detail):''}・${new Date(r.t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
   <div class="pair ${mv?'':'single'}">${hexBlock(ben,vals,'本卦・現在',true)}
     ${mv?`<div class="arrow"><svg viewBox="0 0 28 16"><path d="M2 8h22M18 3l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>變爻<br>${vals.map((v,i)=>(v===6||v===9)?POS[i]:'').join('')}</div>${hexBlock(bian,vals,'變卦・走向',false)}`:''}</div>

   <div class="key"><div class="why">這次最該看的 <span>— ${k.why}，${k.hint}</span></div>
     ${k.items.map(it=>`<div class="kitem"><div class="src"><em>${it.tag}</em>${esc(it.src)}</div><p class="gl">${esc(it.gl)}</p></div>`).join('')}</div>

   <div class="sec"><h3>${ben.name}卦 <span class="lv lv-${ben.lv}">${ben.lv}</span></h3>
     <p class="classic">${ben.ci}</p><p class="xiang">《象》曰：${ben.xiang}</p></div>
   <div class="sec"><dl class="facets"><dt>運勢</dt><dd>${ben.fort}</dd><dt>感情</dt><dd>${ben.love}</dd><dt>事業</dt><dd>${ben.work}</dd><dt>建議</dt><dd>${ben.adv}</dd></dl></div>
   ${mv?`<div class="sec"><h3>之後的走向：${bian.name}卦 <span class="lv lv-${bian.lv}">${bian.lv}</span></h3><p class="classic">${bian.ci}</p><p>${bian.fort}${bian.adv}</p></div>`:''}

   <details><summary>${ben.name}卦的六爻原文與白話</summary>
     <ul class="alll">${ben.lines.slice(0,6).map((l,i)=>`<li class="${mvSet[i]?'mv':''}"><b>${l[0]}</b><div><p class="c">${l[1]}</p><p class="g">${ben.mod[i]}</p></div></li>`).join('')}</ul>
   </details>
   <div class="center"><button class="btn" data-act="again">再起一卦</button><button class="btn ghost" data-act="share">分享結果連結</button><button class="btn ghost" data-act="copy">複製結果</button></div>
   <p class="note">易經是一面鏡子，幫你換個角度看事情。同一件事不必反覆占問，決定權永遠在你手上。</p>
  </section>`;
}
function resultText(r){
  const ben=hexOf(r.vals),bian=hexOf(r.vals,true),k=keyReading(r.vals),mv=r.vals.some(v=>v===6||v===9);
  return `【易卦小館】${r.q||'整體運勢'}\n${MNAME[r.method]}${r.detail?'・'+r.detail:''}\n本卦：${ben.full}（${ben.lv}）${mv?`\n變卦：${bian.full}（${bian.lv}）`:''}\n\n最該看：${k.why}，${k.hint}\n`+
   k.items.map(i=>`${i.src}\n→ ${i.gl}`).join('\n')+`\n\n運勢：${ben.fort}\n感情：${ben.love}\n事業：${ben.work}\n建議：${ben.adv}\n\n`+shareURL(r);
}
function renderHist(){
  const h=store.get('iching-history',[]);
  $('#v-hist').innerHTML=h.length?`<div class="hist">${h.map((r,i)=>{const b=hexOf(r.vals),c=hexOf(r.vals,true),mv=r.vals.some(v=>v===6||v===9);
    return `<button class="hi" data-act="hopen" data-v="${i}"><div class="mini">${b.a.split('').map((y,j)=>barHTML(+y,r.vals[j]===6||r.vals[j]===9)).join('')}</div>
    <div class="t"><b>${b.name}${mv?' → '+c.name:''}</b><span>${r.q?esc(r.q):'整體運勢'}</span><span>${MNAME[r.method]}・${new Date(r.t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div></button>`}).join('')}</div>
    <div class="center"><button class="link" data-act="hclear" id="hclear">清除全部紀錄</button></div>`
   :`<div class="empty">還沒有紀錄。<br>起一卦之後會自動存在這台裝置上。</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b===tb));
    $('#v-cast').hidden=tb.dataset.tab!=='cast';$('#v-hist').hidden=tb.dataset.tab!=='hist';if(tb.dataset.tab==='hist')renderHist();return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'sugg':S.q=v;$('#q').value=v;break;
    case 'method':S.method=v;render();break;
    case 'toss':{tossOnce();$('#mbody').innerHTML=coinHTML();document.querySelectorAll('.coin').forEach(c=>c.classList.add('spin'));break}
    case 'toss-all':while(S.coin.length<6)tossOnce();$('#mbody').innerHTML=coinHTML();break;
    case 'reset-coin':S.coin=[];S.last=null;$('#mbody').innerHTML=coinHTML();break;
    case 'cast-coin':{const vals=S.coin.slice();S.coin=[];S.last=null;cast(vals,'coin','');break}
    case 'sk':{const i=+el.dataset.i,c=nameCalc();S.adj[i]=Math.max(1,(c.st[i]||0)+ +el.dataset.d);$('#namecalc').innerHTML=nameCalcHTML(nameCalc());break}
    case 'cast-name':{const c=nameCalc();if(!c.ok)break;cast(meihua(mod(c.a,8),mod(c.b,8),mod(c.a+c.b,6)),'name',`${S.sur}${S.giv}（姓 ${c.a} 畫、名 ${c.b} 畫）`);break}
    case 'numrand':S.n1=String(1+rnd(99));S.n2=String(1+rnd(99));$('#n1').value=S.n1;$('#n2').value=S.n2;$('#castnum').disabled=false;break;
    case 'cast-num':{if(!valid2())break;const x=+S.n1,y=+S.n2;cast(meihua(mod(x,8),mod(y,8),mod(x+y,6)),'num',`${x}、${y}`);break}
    case 'again':S.res=null;render();window.scrollTo({top:0});break;
    case 'copy':{const t=resultText(S.res);try{navigator.clipboard.writeText(t).then(()=>toast('已複製，可以貼給朋友'),()=>copyFallback(t))}catch(err){copyFallback(t)}break}
    case 'hopen':{const r=store.get('iching-history',[])[+v];if(!r)break;S.res=r;document.querySelector('[data-tab=cast]').click();render();window.scrollTo({top:0});break}
    case 'hclear':if(el.dataset.sure){store.set('iching-history',[]);renderHist();toast('已清除')}else{el.dataset.sure=1;el.textContent='再點一次確定清除';el.style.color='var(--cinnabar)'}break;
  }
});
function copyFallback(t){const box=document.createElement('textarea');box.className='copybox';box.readOnly=true;box.value=t;V.querySelector('.center').after(box);box.focus();box.select();toast('請長按文字複製')}


/* ---- 問問小豬: share links + stats ---- */
const dgT=p=>{try{window.dgTrack&&window.dgTrack(p)}catch(e){}};
function dgToast(m){let t=document.querySelector('.dg-toast');if(!t){t=document.createElement('div');t.className='dg-toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2000)}
function dgBase(){return location.href.split('#')[0].split('?')[0]}
function dgShare(url,title,anchor){
  dgT(location.pathname.replace(/^.*\//,'').replace('.html','')+'/share');
  if(navigator.share){navigator.share({title:title,text:title,url:url}).catch(()=>{});return}
  const fb=()=>{if(!anchor)return;let b=anchor.parentElement.querySelector('.dg-copy');if(!b){b=document.createElement('textarea');b.className='dg-copy';b.readOnly=true;b.rows=3;anchor.parentElement.after(b)}b.value=url;b.focus();b.select();dgToast('長按連結複製')};
  try{navigator.clipboard.writeText(url).then(()=>dgToast('已複製連結，貼給朋友吧'),fb)}catch(e){fb()}
}
function dgSharedBanner(el,again){el.insertAdjacentHTML('afterbegin',`<div class="dg-shared"><span>這是朋友分享給你的結果</span><a href="${again}">換我抽一次 →</a></div>`)}

function shareURL(r){const u=new URLSearchParams();u.set('v',r.vals.join(''));u.set('m',r.method);if(r.detail)u.set('d',r.detail);if(r.q)u.set('q',r.q);return dgBase()+'?'+u.toString()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act="share"]');if(!el||!S.res)return;dgShare(shareURL(S.res),'我起到的卦｜問問小豬',el)});
const _cast=cast;cast=function(vals,m,d){_cast(vals,m,d);const b=hexOf(vals);dgT('iching/done/'+m);dgT('iching/hex/'+b.full)};
const _renderResult=renderResult;renderResult=function(){_renderResult();if(S.res&&S.res.shared)dgSharedBanner(V,dgBase())};
(function(){
  const P=new URLSearchParams(location.search),v=P.get('v');
  if(v&&/^[6-9]{6}$/.test(v)){const m=P.get('m');S.res={t:Date.now(),q:P.get('q')||'',method:MNAME[m]?m:'coin',detail:P.get('d')||'',vals:v.split('').map(Number),shared:true};dgT('iching/opened-share')}
  render();
})();
