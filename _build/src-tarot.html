<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a bright reading table — clear morning-sky ground, white surfaces, one calm blue for anything you can touch. Single light theme by choice. */
:root{
  --velvet:#f3f6f8; --velvet-2:#ffffff; --sky:#e3eef5;
  --brass:#2b6f96; --brass-dim:#7a9fb5; --on-accent:#ffffff; --tint:rgba(43,111,150,.09);
  --paper:#ffffff; --ink:#1e2a33;
  --text:#1e2a33; --muted:#66737d; --line:#dbe3e8; --shadow:rgba(30,42,51,.16);
  --w:#b4472e; --c:#2f6f80; --s:#4b5578; --p:#6f7a2e; --m:#6b2d5c;
  --good:#2f7d4a; --warn:#b5601b;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"LXGW WenKai TC","Kaiti TC","STKaiti","Noto Serif TC",serif;
  color-scheme:light;
}
html,body{background:var(--velvet);color:var(--text)}
body{font-family:var(--f-body);font-size:16px;line-height:1.7;min-height:100%;
  background:radial-gradient(120% 60% at 50% -10%,var(--sky) 0%,var(--velvet) 65%) fixed,var(--velvet)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--velvet)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.12em;color:var(--brass);display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px}
.tabs{display:flex;gap:2px;background:var(--velvet);border-radius:999px;padding:3px}
.tabs button{background:none;border:0;padding:6px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--brass);color:var(--on-accent);font-weight:700}

.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:13px;letter-spacing:.2em;color:var(--brass-dim)}
.hero h1{font-size:clamp(28px,7vw,40px);font-weight:900;margin:4px 0 6px}
.hero p{color:var(--muted);margin:0;max-width:34em}
.block{margin-top:26px}
.label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.label h2{font-size:17px;font-weight:700}
.label small{color:var(--muted);font-size:13px}

textarea,input[type=text]{width:100%;background:var(--velvet-2);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font:inherit;font-size:17px;padding:12px 14px;resize:none}
textarea::placeholder,input::placeholder{color:#9aa5ad}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sugg button{background:none;border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.hint{margin-top:10px;background:var(--tint);border:1px solid var(--brass-dim);color:var(--text);border-radius:12px;padding:10px 14px;font-size:14px;width:100%;text-align:left}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--velvet-2);border-radius:999px;padding:7px 16px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--brass);background:var(--tint);color:var(--brass);font-weight:700}

.spreads{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.spreads{grid-template-columns:1fr 1fr}}
.sp{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--velvet-2);border-radius:14px;padding:12px 14px;position:relative}
.sp[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.sp .mini{flex:0 0 58px;height:48px;position:relative}
.sp .mini i{position:absolute;width:9px;height:14px;border-radius:2px;background:var(--brass-dim);transform:translate(-50%,-50%)}
.sp[aria-pressed="true"] .mini i{background:var(--brass)}
.sp b{font-family:var(--f-display);font-size:16px;display:block}
.sp span{font-size:13px;color:var(--muted);display:block;line-height:1.5}
.sp .rec{position:absolute;top:-8px;right:10px;background:var(--brass);color:var(--on-accent);font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.1em}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

.opts{display:grid;gap:2px;background:var(--velvet-2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px}
.opt+.opt{border-top:1px solid var(--line)}
.opt span small{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.sw{appearance:none;flex:0 0 46px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px var(--shadow);transition:transform .2s}
.sw:checked{background:var(--brass)}
.sw:checked::after{transform:translateX(20px)}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px}
.btn{border:0;border-radius:999px;padding:13px 26px;font-size:17px;font-weight:700;background:var(--brass);color:var(--on-accent);font-family:var(--f-display);letter-spacing:.06em}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--brass);border:1px solid var(--brass-dim)}
.btn.small{padding:8px 16px;font-size:14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px}

.steps{display:flex;gap:6px;margin-bottom:18px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.steps span{padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.steps span.on{border-color:var(--brass);color:var(--brass)}
.steps span.done{color:var(--brass-dim)}

.stage-c{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.stage-c p{color:var(--muted);margin:0;max-width:26em}
.qecho{font-family:var(--f-display);font-size:18px;color:var(--text);max-width:24em}
.stack{position:relative;width:132px;height:226px;margin:26px 0 14px;border:0;background:none;padding:0}
.stack .sc{position:absolute;inset:0;transition:transform .3s}
.stack .sc svg,.pile svg,.fc svg,.slot svg,.libc svg,.tray svg{display:block;width:100%;height:100%}
.cf img,.libc img,.sheet .big img{display:block;width:100%;height:100%;object-fit:cover;border-radius:6px;background:var(--paper)}
.stack .sc{filter:drop-shadow(0 6px 10px var(--shadow))}
.stack.riffle .sc:nth-child(odd){animation:rl .75s ease}
.stack.riffle .sc:nth-child(even){animation:rr .75s ease}
@keyframes rl{45%{transform:translateX(-62%) rotate(-10deg)}100%{transform:none}}
@keyframes rr{45%{transform:translateX(62%) rotate(10deg)}100%{transform:none}}
.count{font-family:var(--f-display);color:var(--brass);font-size:15px;letter-spacing:.1em}

.piles{display:flex;gap:18px;justify-content:center;margin:20px 0 8px}
.pile{width:84px;height:144px;position:relative;border:0;background:none;padding:0;transition:transform .5s}
.pile i{position:absolute;inset:0;filter:drop-shadow(0 4px 6px var(--shadow))}
.pile i:nth-child(2){transform:translate(2px,-3px)} .pile i:nth-child(3){transform:translate(4px,-6px)}
.pile.chosen{transform:translateY(-28px) scale(1.06)}
.pile.away{opacity:.35}
.pile em{position:absolute;bottom:-28px;left:0;right:0;font-style:normal;font-size:13px;color:var(--muted)}

.tray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.tray div{width:48px;text-align:center;font-size:11px;color:var(--muted);line-height:1.3}
.tray i{display:block;width:48px;height:82px;border:1px dashed var(--line);border-radius:5px;margin-bottom:4px}
.tray i.filled{border:0;animation:pop .35s ease}
.tray i.filled img{display:block;width:100%;height:100%;border-radius:4px;object-fit:cover}
.tray i.filled.rev img{transform:rotate(180deg)}
.tray i.next{border-color:var(--brass)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.table{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:5px 4px;margin:18px 0 10px;padding:12px 8px;border-radius:16px;
  background:radial-gradient(90% 80% at 50% 40%,#ffffff,var(--sky));border:1px solid var(--line)}
.fc{aspect-ratio:7/12;width:100%;border:0;background:none;padding:0;transform:rotate(var(--r)) translateY(var(--y));transition:transform .2s,opacity .3s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));position:relative}
.fc:hover{transform:rotate(0) translateY(-4px) scale(1.08);z-index:2}
.fc.taken{opacity:0;transform:translateY(-16px) scale(.8);pointer-events:none}
.fc.taken::after{content:""}
.fc:disabled{cursor:default}
.nextpos{font-family:var(--f-display);font-size:20px}
.nextpos small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted)}

.qhead{margin-bottom:6px}
.qhead .q{font-family:var(--f-display);font-size:clamp(20px,5vw,26px);font-weight:700}
.qhead .meta{color:var(--muted);font-size:13px}
.board{position:relative;width:100%;margin:18px 0 6px}
.slot{position:absolute;border:0;background:none;padding:0;perspective:800px}
.slot .num{position:absolute;top:-9px;left:-9px;z-index:3;width:20px;height:20px;border-radius:50%;background:var(--brass);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--f-display)}
.slot.focus .cf{box-shadow:0 0 0 2px var(--brass),0 0 18px rgba(43,111,150,.35)}
.slot.cross{z-index:2}
.card{width:100%;height:100%}
.ci{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;border-radius:6px}
.slot.flipped .ci{transform:rotateY(180deg)}
.cb,.cf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;box-shadow:0 5px 12px var(--shadow)}
.cb{transform:rotateY(0deg)}
.cf{transform:rotateY(180deg)}
.rev .cf img,.sheet .big.rev img{transform:rotate(180deg)}
.sheet .big img{transition:transform .5s}
.boardhint{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 0}
.boardbar{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}

.focuspanel{margin-top:22px;background:var(--velvet-2);border:1px solid var(--line);border-radius:16px;padding:18px}
.fp-pos{font-size:13px;color:var(--brass);letter-spacing:.12em}
.fp-pos small{color:var(--muted);letter-spacing:0}
.fp-name{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.fp-name h3{font-size:24px;font-weight:900}
.badge{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid currentColor;font-weight:700}
.badge.up{color:var(--good)} .badge.rv{color:var(--warn)}
.en{color:var(--muted);font-size:13px;font-family:var(--f-display);letter-spacing:.04em}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.kws span{font-size:13px;background:var(--tint);color:var(--brass);padding:2px 10px;border-radius:6px}
.fp p{margin:0 0 10px;max-width:38em}
.fp .tl{border-left:2px solid var(--brass-dim);padding-left:12px;color:var(--text)}
.fp .adv{color:var(--muted);font-size:15px}
.fp .adv b{color:var(--brass)}
.fpnav{display:flex;justify-content:space-between;margin-top:8px}
.fp-empty{color:var(--muted);text-align:center;padding:12px 0}

.synth{margin-top:26px;border-top:1px solid var(--line);padding-top:22px}
.synth h2{font-size:22px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--velvet-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{font-family:var(--f-display);font-size:20px;display:block;color:var(--brass);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.synth p{margin:0 0 12px;max-width:38em}
.summary{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:6px}
.summary li{display:flex;gap:10px;align-items:baseline;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.summary li em{font-style:normal;color:var(--muted);flex:0 0 7.5em;font-size:13px}
.summary li span{min-width:0}
.foot{margin-top:22px;color:var(--muted);font-size:13px;text-align:center}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:12px}
.libc{border:0;background:none;padding:0;text-align:center;font-size:13px;color:var(--muted)}
.libc .face{aspect-ratio:7/12;max-width:100%;margin-bottom:4px;filter:drop-shadow(0 3px 5px var(--shadow))}

.hist{display:grid;gap:10px;margin-top:16px}
.hi{background:var(--velvet-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.hi-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hi .q{font-family:var(--f-display);font-weight:700;font-size:16px}
.hi .meta{color:var(--muted);font-size:12px}
.hi .cards{font-size:14px;margin-top:6px;color:var(--text)}
.hi .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

.scrim{position:fixed;inset:0;background:rgba(30,42,51,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--velvet-2);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--line);
  padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{float:right;background:none;border:1px solid var(--line);border-radius:999px;width:34px;height:34px}
.sheet .big{width:150px;aspect-ratio:7/12;margin:8px auto 12px;filter:drop-shadow(0 6px 12px var(--shadow))}
.sheet h3{font-size:24px;text-align:center}
.sheet .en{text-align:center}
.two{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
.two div{background:var(--velvet);border:1px solid var(--line);border-radius:12px;padding:12px}
.two h4{margin:0 0 4px;font-family:var(--f-display);font-size:15px}
.two p{margin:0;font-size:15px}
.copybox{width:100%;height:220px;font-size:14px;margin-top:10px}

.toast{white-space:nowrap;box-shadow:0 4px 14px var(--shadow);position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brass);color:var(--on-accent);
  padding:8px 18px;border-radius:999px;font-weight:700;z-index:30;font-size:14px}

.paper{fill:var(--paper)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ---------- data ---------- */
const MAJORS=[
['愚者','The Fool','新開始、冒險、純真、自由','魯莽、猶豫、不切實際','一段全新的旅程正在展開，帶著好奇心勇敢踏出第一步。','衝動行事或過度猶豫，起步前需要多一點準備。','輕鬆自在的新戀情，或為關係注入新鮮感。','適合嘗試新領域、轉換跑道。','相信直覺，但別忘了看路。'],
['魔術師','The Magician','創造力、行動、資源、自信','能力未發揮、操弄、缺乏方向','你擁有實現目標所需的一切，現在正是把想法變成行動的時候。','才能被閒置，或有人言過其實，留意誠信與專注。','主動表達會帶來好結果，吸引力強。','能力受肯定，適合提案、開創。','把手上的工具用起來。'],
['女祭司','The High Priestess','直覺、潛意識、靜默、智慧','忽略直覺、秘密、流於表面','答案藏在內心深處，靜下來傾聽直覺。','你可能忽略了內在聲音，或有資訊尚未浮上檯面。','關係中有未說出口的情感，需要耐心。','先觀察、收集資訊，不急著表態。','安靜下來，相信自己的感覺。'],

['皇帝','The Emperor','權威、結構、穩定、領導','控制、僵化、獨斷','建立秩序與規則，以理性和紀律掌握局面。','過度控制或缺乏紀律，權力關係失衡。','穩定可靠，但留意別太強勢。','適合擔任領導，用制度管理。','訂下計畫，堅定執行。'],

function face(c,lazy){return `<img src="cards/${c.id}.webp" alt="${c.name}" ${lazy?'loading="lazy"':''} draggable="false">`}
function faceSVG(c){
  const ink=c.major?INK.m:INK[c.suit];
  let top=c.major?ROMAN[c.i]:(c.rank===1?'A':c.rank<=10?String(c.rank):SUIT[c.suit].n);
  let art='';
  if(c.major){
    art=`<circle cx="50" cy="72" r="34" fill="none" stroke="${ink}" stroke-opacity=".25" stroke-width=".6"/><g transform="translate(23,45) scale(.54)" fill="none" stroke="${ink}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="--fi:${ink}">${ART[c.i]}</g>`;
  }else if(c.rank<=10){
    const sz=c.rank===1?46:c.rank<=4?24:c.rank<=6?21:17;
    art=PIPS[c.rank].map(([x,y])=>{const px=10+x*.8,py=26+y*.92;return `<use href="#s-${c.suit}" x="${(px-sz/2).toFixed(1)}" y="${(py-sz/2).toFixed(1)}" width="${sz}" height="${sz}"/>`}).join('');
    art=`<g fill="${ink}" stroke="${ink}">${art}</g>`;
  }else{
    art=`<g fill="${ink}" stroke="${ink}"><use href="#s-${c.suit}" x="37" y="30" width="26" height="26"/></g><text x="50" y="108" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="900" font-size="34" fill="${ink}">${'侍騎后王'[c.rank-11]}</text>`;
  }
  const name=c.major?c.name:(c.rank===1?SUIT[c.suit].n+'王牌':c.name);
  return `<svg viewBox="0 0 100 160" aria-label="${c.name}"><rect x="0" y="0" width="100" height="160" rx="6" class="paper"/>
  <rect x="5" y="5" width="90" height="150" rx="3" fill="none" stroke="${ink}" stroke-width=".9"/>
  <text x="50" y="19" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="700" font-size="${top.length>3?8:10}" fill="${ink}" letter-spacing="1">${top}</text>
  ${art}
  <path d="M14 131h72" stroke="${ink}" stroke-width=".5"/>
  <text x="50" y="146" text-anchor="middle" font-family="Noto Serif TC,serif" font-weight="700" font-size="${name.length>4?9:10.5}" fill="var(--ink)">${name}</text></svg>`;
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}

const V=$('#v-draw');
function stepsBar(cur){const n=['問題','洗牌','切牌','抽牌','解讀'],k=['setup','shuffle','cut','pick','reading'];const ci=k.indexOf(cur);
  return `<div class="steps">${n.map((x,i)=>`<span class="${i===ci?'on':i<ci?'done':''}">${x}</span>`).join('')}</div>`}

  const suggest=['這段感情接下來會怎麼發展？','我適合換工作嗎？','最近需要注意什麼？','我該怎麼面對現在的困難？'];
  const choiceHint=/還是|or |要不要|該不該/.test(S.q)&&S.spread!=='choice';
  V.innerHTML=`${stepsBar('setup')}
  <div class="hero"><div class="eyebrow">TONIGHT'S READING</div><h1>今晚，想問什麼？</h1>
  <p>把問題想清楚再抽牌，答案會更貼近你。開放式的問題（「我該怎麼…」）通常比是非題更有收穫。</p></div>

  <div class="block"><div class="label"><h2>你的問題</h2><small>可以留白，只看整體運勢</small></div>
  <textarea id="q" rows="2" maxlength="120" placeholder="例如：我和他之間的關係會怎麼發展？">${esc(S.q)}</textarea>
  <div class="sugg">${suggest.map(s=>`<button data-act="sugg" data-v="${esc(s)}">${s}</button>`).join('')}</div>

  <div class="chips">${Object.entries(TOPICS).map(([k,v])=>`<button class="chip" data-act="topic" data-v="${k}" aria-pressed="${S.topic===k}">${v}</button>`).join('')}</div></div>

  <div class="block"><div class="label"><h2>牌陣</h2><small>第一次玩建議三張牌</small></div>

  ${S.spread==='choice'?`<div class="ab"><input type="text" id="A" maxlength="12" placeholder="選項 A，例如：留下" value="${esc(S.A)}"><input type="text" id="B" maxlength="12" placeholder="選項 B，例如：離職" value="${esc(S.B)}"></div>`:''}</div>

  <div class="block opts">
    <label class="opt"><span>包含逆位牌<small>牌倒過來出現時，代表能量受阻或向內，解讀更細膩</small></span><input type="checkbox" class="sw" id="optRev" ${S.rev?'checked':''}></label>
    <label class="opt"><span>只用 22 張大牌<small>大阿爾克那談人生課題，訊息更集中</small></span><input type="checkbox" class="sw" id="optMaj" ${S.majorOnly?'checked':''}></label>
  </div>

  <div class="actions"><button class="btn" data-act="start">開始洗牌</button><button class="link" data-act="quick">直接抽牌，略過洗牌和切牌</button></div>`;
  $('#q').addEventListener('input',e=>{const had=/還是|or |要不要|該不該/.test(S.q);S.q=e.target.value;const has=/還是|or |要不要|該不該/.test(S.q);if(had!==has){const pos=e.target.selectionStart;renderSetup();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}});
  ['A','B'].forEach(k=>{const el=$('#'+k);el&&el.addEventListener('input',e=>S[k]=e.target.value)});
  $('#optRev').addEventListener('change',e=>{S.rev=e.target.checked;savePrefs()});
  $('#optMaj').addEventListener('change',e=>{S.majorOnly=e.target.checked;savePrefs()});
}
function savePrefs(){store.set('tarot-prefs',{rev:S.rev,majorOnly:S.majorOnly})}

function newDeck(){S.deck=CARDS.filter(c=>!S.majorOnly||c.major).map(c=>({id:c.id,rev:false}));S.shuffles=0;S.picks=[]}
function shuffleOnce(){const d=S.deck;for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}
  if(S.rev)d.forEach(c=>{if(rnd(2))c.rev=!c.rev});S.shuffles++}

function renderShuffle(){
  V.innerHTML=`${stepsBar('shuffle')}<div class="stage-c">
  ${S.q?`<div class="qecho">「${esc(S.q)}」</div>`:''}
  <p>深呼吸，在心裡默念你的問題。<br>準備好就點一下牌堆洗牌，想洗幾次都可以。</p>
  <button class="stack" id="stack" aria-label="洗牌">${Array.from({length:7},(_,i)=>`<div class="sc" style="transform:translate(${i*1.5}px,${-i*1.5}px)">${BACK}</div>`).join('')}</button>
  <div class="count" id="cnt">${S.shuffles?`已洗 ${S.shuffles} 次`:'點牌堆洗牌'}</div>
  <div class="actions" style="justify-content:center;margin-top:8px"><button class="btn" data-act="to-cut" ${S.shuffles?'':'disabled style="opacity:.45"'} id="toCut">洗好了，切牌</button></div>
  <button class="link" data-act="back-setup">回去修改問題</button></div>`;
  $('#stack').addEventListener('click',()=>{const st=$('#stack');st.classList.remove('riffle');void st.offsetWidth;st.classList.add('riffle');shuffleOnce();
    $('#cnt').textContent=`已洗 ${S.shuffles} 次`;const b=$('#toCut');b.disabled=false;b.style.opacity=1});
}
function renderCut(){
  V.innerHTML=`${stepsBar('cut')}<div class="stage-c">
  <p>牌已經分成三疊。<br>憑直覺選一疊，它會被放到最上面。</p>
  <div class="piles">${[0,1,2].map(i=>`<button class="pile" data-act="cut" data-v="${i}" aria-label="第 ${i+1} 疊">${'<i>'+BACK+'</i>'.repeat(1)}<i>${BACK}</i><i>${BACK}</i><em>第 ${i+1} 疊</em></button>`).join('')}</div></div>`;
}
function doCut(i){
  const n=S.deck.length,a=Math.floor(n/3)+rnd(5)-2,b=Math.floor(2*n/3)+rnd(5)-2;
  const piles=[S.deck.slice(0,a),S.deck.slice(a,b),S.deck.slice(b)];
  S.deck=[...piles[i],...piles.filter((_,k)=>k!==i).flat()];
  document.querySelectorAll('.pile').forEach((p,k)=>p.classList.add(k===i?'chosen':'away'));
  setTimeout(()=>go('pick'),650);
}

function renderPick(){
  const sp=SP[S.spread],need=sp.pos.length,r={A:S.A,B:S.B};
  const nxt=S.picks.length<need?sp.pos[S.picks.length]:null;
  V.innerHTML=`${stepsBar('pick')}<div class="stage-c">
  <div class="nextpos" id="nextpos">${nxt?`第 ${S.picks.length+1} 張：${lab(nxt[0],r)}<small>${lab(nxt[1],r)}</small>`:'牌已抽齊'}</div>
  <div class="tray" id="tray">${sp.pos.map((p,i)=>`<div><i class="${i<S.picks.length?'filled':i===S.picks.length?'next':''}">${i<S.picks.length?BACK:''}</i>${lab(p[0],r).replace(/「|」/g,'')}</div>`).join('')}</div>
  <p style="font-size:14px">${nxt?'所有牌都攤在桌上了，點一張讓你有感覺的牌':'準備好就翻開牌陣'}</p></div>
  <div class="table" id="table" style="--cols:${tableCols()}">${S.deck.map((c,i)=>`<button class="fc ${S.picks.includes(i)?'taken':''}" data-act="draw" data-v="${i}" style="--r:${jit(i,0)}deg;--y:${jit(i,1)/2}px" aria-label="第 ${i+1} 張牌" ${nxt?'':'disabled'}>${BACK}</button>`).join('')}</div>
  <div class="actions" style="justify-content:center;margin-top:0">
    <button class="btn ghost small" data-act="undo" ${S.picks.length?'':'disabled style="opacity:.4"'}>放回上一張</button>
    <button class="btn ghost small" data-act="auto" ${nxt?'':'hidden'}>幫我隨機抽</button>
    <button class="btn" data-act="to-reading" ${nxt?'hidden':''}>翻開牌陣</button></div>`;
}
function tableCols(){const n=S.deck.length,w=Math.min(innerWidth,760);if(n<=22)return w<520?6:11;return w<520?9:13}
function jit(i,k){const x=Math.sin((i+1)*(k?78.233:12.9898)+S.shuffles*3.1)*43758.5453;return ((x-Math.floor(x))*6-3).toFixed(1)}
function drawCard(i){const need=SP[S.spread].pos.length;if(S.picks.length>=need||S.picks.includes(i))return;S.picks.push(i);
  const btn=document.querySelector(`.fc[data-v="${i}"]`);if(btn)btn.classList.add('taken');setTimeout(()=>{const y=window.scrollY;renderPick();window.scrollTo(0,y)},280);
  if(S.picks.length===need)setTimeout(()=>{if(S.step==='pick'&&S.picks.length===need)startReading()},900)}

function startReading(){
  const r={t:Date.now(),q:S.q.trim(),topic:S.topic,spread:S.spread,A:S.A.trim(),B:S.B.trim(),cards:S.picks.map(i=>({...S.deck[i]})),flipped:[]};
  S.reading=r;S.focus=-1;r._auto=true;r.cards.forEach(c=>{const im=new Image();im.src='cards/'+c.id+'.webp'});
  const h=store.get('tarot-history',[]);h.unshift({t:r.t,q:r.q,topic:r.topic,spread:r.spread,A:r.A,B:r.B,cards:r.cards});store.set('tarot-history',h.slice(0,60));
  go('reading');
}

function tone(c){const base=HARD.has(c.id)?-1:1;return c.rev?(base<0?.3:-.5):base}
function topicLine(c,rev,topic){
  if(topic==='general')return '';
  if(c.major){const base=topic==='love'?c.love:c.work;return rev?`逆位時，「${base.replace(/。$/,'')}」這股力量暫時受阻，需要多一點耐心或調整。`:base}
  return SUIT[c.suit][topic]+(rev?'。逆位表示這方面的能量卡住了，或用得過頭。':'。')
}
function advice(c,rev){return c.major?c.a:(rev?SUIT[c.suit].rv:SUIT[c.suit].up)+'。'}

function renderReading(){
  const r=S.reading,sp=SP[r.spread];
  V.innerHTML=`${stepsBar('reading')}
  <div class="qhead"><div class="q">${r.q?esc(r.q):'整體運勢'}</div><div class="meta">${TOPICS[r.topic]}・${sp.n}・${new Date(r.t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>
  <div class="board" id="board">${r.cards.map((c,i)=>`<button class="slot ${sp.pos[i][4]?'cross':''} ${r.flipped.includes(i)?'flipped':''} ${c.rev?'rev':''} ${S.focus===i?'focus':''}" data-act="flip" data-v="${i}" aria-label="${lab(sp.pos[i][0],r)}"><span class="num">${i+1}</span><div class="ci"><div class="cb">${BACK}</div><div class="cf">${face(BYID[c.id])}</div></div></button>`).join('')}</div>
  <p class="boardhint" id="bhint"></p>
  <div class="boardbar" id="bbar"></div>
  <div id="fp"></div><div id="synth"></div>`;
  layoutBoard();updateReading();
  if(r._auto){r._auto=false;r.cards.forEach((_,i)=>setTimeout(()=>{if(S.reading===r)flip(i,true)},350+i*260));setTimeout(()=>{if(S.reading===r){S.focus=0;updateReading()}},450+r.cards.length*260)}
}
function layoutBoard(){
  const b=$('#board');if(!b||!S.reading)return;const sp=SP[S.reading.spread];
  const W=b.clientWidth,cell=W/sp.cols,cw=Math.min(cell*sp.f,sp.cols===1?160:132),ch=cw*12/7,rowH=ch*1.07;
  b.style.height=(sp.rows*rowH)+'px';
  b.querySelectorAll('.slot').forEach((el,i)=>{const p=sp.pos[i];el.style.width=cw+'px';el.style.height=ch+'px';
    el.style.left=(p[2]*cell-cw/2)+'px';el.style.top=(p[3]*rowH-ch/2)+'px';el.style.transform=p[4]?'rotate(90deg)':''});
}
function updateReading(){
  const r=S.reading,sp=SP[r.spread],n=r.cards.length,all=r.flipped.length===n;
  document.querySelectorAll('.slot').forEach((el,i)=>{el.classList.toggle('flipped',r.flipped.includes(i));el.classList.toggle('focus',S.focus===i)});
  $('#bhint').textContent=all?'點任一張牌，重看它的解讀':r.flipped.length?`還有 ${n-r.flipped.length} 張沒翻開`:'照著號碼，一張一張點開來看';
  $('#bbar').innerHTML=all?'':`<button class="btn ghost small" data-act="flip-next">翻下一張（第 ${firstUnflipped()+1} 張）</button>${n>1?'<button class="link" data-act="flip-all">全部翻開</button>':''}`;
  const fp=$('#fp');
  if(S.focus<0){fp.innerHTML=`<div class="focuspanel"><div class="fp-empty">每張牌都有自己的位置意義。<br>先看第 1 張「${esc(lab(sp.pos[0][0],r))}」吧。</div></div>`}
  else{
    const i=S.focus,c=r.cards[i],d=BYID[c.id],p=sp.pos[i];
    fp.innerHTML=`<div class="focuspanel fp">
     <div class="fp-pos">第 ${i+1} 張・${esc(lab(p[0],r))} <small>— ${esc(lab(p[1],r))}</small></div>
     <div class="fp-name"><h3>${d.name}</h3><span class="badge ${c.rev?'rv':'up'}">${c.rev?'逆位':'正位'}</span><span class="en">${d.en}</span></div>
     <div class="kws">${(c.rev?d.kr:d.k).map(k=>`<span>${k}</span>`).join('')}</div>
     <p>${c.rev?d.r:d.u}</p>
     ${topicLine(d,c.rev,r.topic)?`<p class="tl">從${TOPICS[r.topic]}來看：${topicLine(d,c.rev,r.topic)}</p>`:''}
     <p class="adv"><b>給你的提醒</b>　${advice(d,c.rev)}</p>
     <div class="fpnav"><button class="link" data-act="focus" data-v="${i-1}" ${i>0?'':'hidden'}>← 上一張</button><span></span><button class="link" data-act="focus-next" ${i<n-1?'':'hidden'}>下一張 →</button></div></div>`;
  }
  $('#synth').innerHTML=all?synthHTML(r):'';
}
function firstUnflipped(){const r=S.reading;for(let i=0;i<r.cards.length;i++)if(!r.flipped.includes(i))return i;return -1}
function flip(i,auto){const r=S.reading;if(!r.flipped.includes(i)){r.flipped.push(i)}if(!auto)S.focus=i;updateReading();
  if(r.flipped.length===r.cards.length&&!r._done){r._done=true;setTimeout(()=>toast('全部翻開了，往下看整體解讀'),800)}}

function synth(r){
  const cs=r.cards.map(c=>({...c,d:BYID[c.id]})),n=cs.length,sp=SP[r.spread],out=[];
  const maj=cs.filter(c=>c.d.major).length,rev=cs.filter(c=>c.rev).length;
  const suits={w:0,c:0,s:0,p:0};cs.forEach(c=>{if(!c.d.major)suits[c.d.suit]++});
  const top=Object.entries(suits).sort((a,b)=>b[1]-a[1]);
  const dom=top[0][1]>=2&&top[0][1]>top[1][1]?top[0][0]:null;
  const avg=cs.reduce((s,c)=>s+tone(c),0)/n;
  const stats={maj,rev,dom,n};
  if(n===1){
    const c=cs[0];
    out.push(`這張「${c.d.name}」${c.rev?'以逆位出現':'以正位出現'}，核心是：${(c.rev?c.d.kr:c.d.k).slice(0,3).join('、')}。${c.rev?c.d.r:c.d.u}`);
    out.push(c.d.major?'它是一張大阿爾克那，代表這個訊息對你來說份量不輕，值得放在心上好幾天。':`它屬於${SUIT[c.d.suit].n}（${SUIT[c.d.suit].el}元素），訊息比較貼近日常，可以馬上用在生活裡。`);
  }else{
    if(maj/n>=.5)out.push(`大阿爾克那佔了 ${maj}/${n}。這件事對你來說不只是日常小事，而是牽涉人生方向的重要課題，影響會比較深遠。`);
    else if(maj===0&&!S.majorOnly)out.push('這次沒有出現大阿爾克那，事情多半屬於日常層面，主導權在你手上，調整做法就能改變結果。');
    else out.push(`大小牌交錯出現：有些部分是大環境的走向，需要順勢；有些細節則可以靠你自己調整。`);
    if(dom)out.push(SUIT[dom].dom);
    if(rev/n>=.5)out.push(`逆位牌有 ${rev} 張，偏多。代表能量有些卡住或向內收，可能有延遲、阻礙，或你還沒準備好面對某些部分。這不是壞兆頭，而是提醒你先處理內在的結。`);
    else if(rev===0&&r.cards.length>=3&&S.rev!==false)out.push('全部都是正位，能量流動順暢，事情的發展相對直接明朗。');
    const courts=cs.filter(c=>!c.d.major&&c.d.rank>10).length;
    if(courts>=2)out.push(`出現了 ${courts} 張宮廷牌，這件事和「人」很有關係：身邊的人，或你自己展現的個性，會是關鍵。`);
    const ranks={};cs.forEach(c=>{if(!c.d.major&&c.d.rank<=10)ranks[c.d.rank]=(ranks[c.d.rank]||0)+1});
    Object.entries(ranks).filter(([,v])=>v>=2).forEach(([k,v])=>out.push(`數字 ${k} 出現了 ${v} 次，強調「${NUMMEAN[k]}」的主題。`));
    if(r.spread==='choice'){
      const tA=tone(cs[1])+tone(cs[2]),tB=tone(cs[3])+tone(cs[4]),A=r.A||'選項A',B=r.B||'選項B';
      out.push(Math.abs(tA-tB)<.8?`「${A}」和「${B}」的牌面能量差不多，兩條路各有得失。這時候比起問哪個比較好，不如問自己：哪一條路的過程是你願意承受的？`
        :`從牌面看，「${tA>tB?A:B}」的走向比較順（結果牌：${cs[tA>tB?2:4].d.name}${cs[tA>tB?2:4].rev?'逆位':''}），「${tA>tB?B:A}」則需要面對較多考驗。但這只是當下的能量，你的心意才是最後的答案。`);
    }else{
      const last=cs[n-1];
      out.push(`最後一張「${last.d.name}」${last.rev?'逆位':'正位'}落在「${lab(sp.pos[n-1][0],r)}」：${last.rev?last.d.r:last.d.u}`);
    }
  }
  out.push(avg>.5?'整體能量偏正面，順著目前的方向前進，保持行動就好。':avg<-.1?'這次的牌面提醒你正在面對一些考驗。塔羅呈現的是當下的能量，不是注定的結果；看清楚卡在哪裡，就有機會改變走向。':'有順也有卡。好的部分繼續保持，卡住的部分先處理，事情會慢慢往好的方向走。');
  return {out,stats};
}
function synthHTML(r){
  const {out,stats}=synth(r),sp=SP[r.spread];
  return `<div class="synth"><div class="eyebrow">THE WHOLE SPREAD</div><h2>整體解讀</h2>
  ${stats.n>1?`<div class="stats"><div class="stat"><b>${stats.maj}/${stats.n}</b><span>大阿爾克那</span></div><div class="stat"><b>${stats.rev}/${stats.n}</b><span>逆位</span></div><div class="stat"><b>${stats.dom?SUIT[stats.dom].el:'—'}</b><span>${stats.dom?SUIT[stats.dom].n+'最多':'元素平均'}</span></div></div>`:''}
  ${out.map(p=>`<p>${esc(p)}</p>`).join('')}
  <ul class="summary">${r.cards.map((c,i)=>`<li><em>${i+1}・${esc(lab(sp.pos[i][0],r))}</em><span>${BYID[c.id].name}${c.rev?'（逆）':''}　${(c.rev?BYID[c.id].kr:BYID[c.id].k).slice(0,2).join('、')}</span></li>`).join('')}</ul>
  <div class="actions"><button class="btn" data-act="again">同一個問題再抽</button><button class="btn ghost" data-act="new">問新的問題</button><button class="link" data-act="copy">複製解讀</button></div>
  <p class="foot">這次抽牌已存到「紀錄」。塔羅反映的是當下的狀態與可能性，最後的選擇在你手上。</p></div>`;
}
function readingText(r){
  const sp=SP[r.spread],{out}=synth(r);
  let t=`【夜燈塔羅】${r.q||'整體運勢'}\n${TOPICS[r.topic]}・${sp.n}・${new Date(r.t).toLocaleString('zh-TW')}\n\n`;
  r.cards.forEach((c,i)=>{const d=BYID[c.id];t+=`${i+1}. ${lab(sp.pos[i][0],r)}：${d.name}${c.rev?'（逆位）':'（正位）'}\n   ${c.rev?d.r:d.u}\n`});
  return t+'\n整體：\n'+out.join('\n');
}

/* ---------- library & history ---------- */
function renderLib(){
  const f=S.lib,list=CARDS.filter(c=>f==='all'||(f==='m'?c.major:c.suit===f));
  $('#v-lib').innerHTML=`<div class="hero"><div class="eyebrow">78 CARDS</div><h1>牌義圖鑑</h1><p>點任一張牌，看它的正位、逆位與在感情、工作上的意思。</p></div>
  <div class="filters">${[['all','全部 78'],['m','大阿爾克那'],['w','權杖・火'],['c','聖杯・水'],['s','寶劍・風'],['p','錢幣・土']].map(([k,v])=>`<button class="chip" data-act="libf" data-v="${k}" aria-pressed="${f===k}">${v}</button>`).join('')}</div>
  <div class="libgrid">${list.map(c=>`<button class="libc" data-act="card" data-v="${c.id}"><div class="face">${face(c,true)}</div>${c.name}</button>`).join('')}</div>`;
}
function cardSheet(id,rev=false){
  const d=BYID[id];
  const lw=d.major?`<div><h4>感情</h4><p>${d.love}</p></div><div><h4>工作</h4><p>${d.work}</p></div>`:`<div><h4>${SUIT[d.suit].n}・${SUIT[d.suit].el}元素</h4><p>${SUIT[d.suit].love}；${SUIT[d.suit].work}。</p></div><div><h4>提醒</h4><p>正位：${SUIT[d.suit].up}。逆位：${SUIT[d.suit].rv}。</p></div>`;
  openSheet(`<button class="x" data-act="close" aria-label="關閉">✕</button>
  <div class="big ${rev?'rev':''}">${face(d)}</div><h3>${d.name}</h3><div class="en">${d.en}</div>
  <div style="text-align:center;margin-top:10px"><button class="btn ghost small" data-act="sheetrev" data-v="${id}" data-r="${rev?0:1}">看${rev?'正':'逆'}位的樣子</button></div>
  <div class="two"><div><h4>正位</h4><div class="kws">${d.k.map(k=>`<span>${k}</span>`).join('')}</div><p>${d.u}</p></div>
  <div><h4>逆位</h4><div class="kws">${d.kr.map(k=>`<span>${k}</span>`).join('')}</div><p>${d.r}</p></div>${lw}</div>`);
}
function renderHist(){
  const h=store.get('tarot-history',[]);
  $('#v-hist').innerHTML=`<div class="hero"><div class="eyebrow">YOUR READINGS</div><h1>抽牌紀錄</h1><p>只存在這台裝置的瀏覽器裡，別人看不到。</p></div>
  ${h.length?`<div class="hist">${h.map((x,i)=>`<div class="hi"><div class="hi-top"><div><div class="q">${x.q?esc(x.q):'整體運勢'}</div>
  <div class="meta">${TOPICS[x.topic]}・${SP[x.spread].n}・${new Date(x.t).toLocaleString('zh-TW',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div></div>
  <div class="cards">${x.cards.map(c=>BYID[c.id].name+(c.rev?'（逆）':'')).join('、')}</div>
  <div class="row"><button class="btn ghost small" data-act="hopen" data-v="${i}">打開解讀</button><button class="link" data-act="hdel" data-v="${i}" id="hd${i}">刪除</button></div></div>`).join('')}</div>`
  :`<div class="empty">還沒有紀錄。<br>到「抽牌」抽第一次牌吧。</div>`}`;
}
function openSheet(html){const s=$('#scrim');s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false}
function closeSheet(){$('#scrim').hidden=true;$('#scrim').innerHTML=''}

/* ---------- routing ---------- */
function go(step){S.step=step;({setup:renderSetup,shuffle:renderShuffle,cut:renderCut,pick:renderPick,reading:renderReading})[step]();window.scrollTo({top:0,behavior:'smooth'})}
function tab(t){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['draw','lib','hist'].forEach(k=>$('#v-'+k).hidden=k!==t);if(t==='lib')renderLib();if(t==='hist')renderHist();if(t==='draw'&&S.step==='reading')setTimeout(layoutBoard,0);window.scrollTo({top:0})}

document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){tab(tb.dataset.tab);return}
  if(e.target.id==='scrim'){closeSheet();return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'sugg':S.q=v;renderSetup();break;
    case 'topic':S.topic=v;if(!S.spreadTouched)S.spread=REC[v];renderSetup();break;
    case 'pick-spread':S.spread=v;S.spreadTouched=true;renderSetup();break;
    case 'start':newDeck();go('shuffle');break;
    case 'quick':newDeck();for(let i=0;i<5;i++)shuffleOnce();go('pick');break;
    case 'back-setup':go('setup');break;
    case 'to-cut':go('cut');break;
    case 'cut':doCut(+v);break;
    case 'draw':drawCard(+v);break;
    case 'undo':S.picks.pop();{const y=window.scrollY;renderPick();window.scrollTo(0,y)}break;
    case 'auto':{const left=S.deck.map((_,i)=>i).filter(i=>!S.picks.includes(i));drawCard(left[rnd(left.length)]);}break;
    case 'to-reading':startReading();break;
    case 'flip':flip(+v);break;
    case 'flip-next':{const i=firstUnflipped();if(i>=0)flip(i)}break;
    case 'flip-all':S.reading.cards.forEach((_,i)=>{if(!S.reading.flipped.includes(i))S.reading.flipped.push(i)});S.focus=0;S.reading._done=true;updateReading();break;
    case 'focus':S.focus=+v;updateReading();break;
    case 'focus-next':{const i=S.focus+1;S.reading.flipped.includes(i)?(S.focus=i,updateReading()):flip(i)}break;
    case 'again':S.q=S.reading.q;S.topic=S.reading.topic;S.spread=S.reading.spread;newDeck();go('shuffle');break;
    case 'new':S.q='';S.A='';S.B='';S.spreadTouched=false;go('setup');break;
    case 'copy':{const txt=readingText(S.reading);
      const ok=()=>toast('已複製，可以貼給朋友');
      try{navigator.clipboard.writeText(txt).then(ok,()=>copyFallback(txt))}catch(err){copyFallback(txt)}}break;
    case 'libf':S.lib=v;renderLib();break;
    case 'card':cardSheet(v);break;
    case 'sheetrev':cardSheet(v,el.dataset.r==='1');break;
    case 'close':closeSheet();break;
    case 'hopen':{const x=store.get('tarot-history',[])[+v];if(!x)break;S.reading={...x,flipped:x.cards.map((_,i)=>i),_done:true};S.focus=0;tab('draw');go('reading');}break;
    case 'hdel':{if(el.dataset.sure){const h=store.get('tarot-history',[]);h.splice(+v,1);store.set('tarot-history',h);renderHist();toast('已刪除')}else{el.dataset.sure=1;el.textContent='再點一次確定刪除';el.style.color='var(--warn)'}}break;
  }
});
function copyFallback(txt){openSheet(`<button class="x" data-act="close" aria-label="關閉">✕</button><h3 style="text-align:left">複製解讀</h3><p style="color:var(--muted);font-size:14px">長按下方文字全選後複製。</p><textarea class="copybox" id="cb" readonly>${esc(txt)}</textarea>`);const t=$('#cb');t.focus();t.select()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layoutBoard,120)});

renderSetup();
</script>

</body></html>
