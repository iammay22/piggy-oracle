const NUMS='一二三四五六七八九十';
function cnum(n){if(n<=10)return n===10?'十':NUMS[n-1];const t=Math.floor(n/10),u=n%10;return (t>1?NUMS[t-1]:'')+'十'+(u?NUMS[u-1]:'')}
const TOPICS={general:'整體',love:'感情',work:'工作',money:'財運'};
const JIAO_SVG=(flat)=>`<svg viewBox="0 0 120 74" aria-hidden="true"><defs>
<linearGradient id="jf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59a6c"/><stop offset="1" stop-color="#d9502f"/></linearGradient>
<radialGradient id="jr" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#ef5a48"/><stop offset=".6" stop-color="#c22a1e"/><stop offset="1" stop-color="#8f130c"/></radialGradient></defs>
<ellipse cx="60" cy="66" rx="48" ry="5" fill="rgba(0,0,0,.14)"/>${flat
  ?'<path d="M8 54 A52 46 0 0 1 112 54 Q60 66 8 54 Z" fill="url(#jf)" stroke="#2a1614" stroke-width="3.2" stroke-linejoin="round"/><path d="M22 51 A38 33 0 0 1 98 51 Q60 59 22 51 Z" fill="#f7b28c" opacity=".75"/><path d="M34 47 Q60 30 86 47" fill="none" stroke="#e57a52" stroke-width="2" stroke-linecap="round" opacity=".8"/>'
  :'<path d="M8 54 A52 46 0 0 1 112 54 Q60 66 8 54 Z" fill="url(#jr)" stroke="#2a1614" stroke-width="3.2" stroke-linejoin="round"/><path d="M28 30 Q46 16 70 15" fill="none" stroke="#ffd2cb" stroke-width="5" stroke-linecap="round" opacity=".7"/><circle cx="82" cy="20" r="2.5" fill="#ffd2cb" opacity=".7"/>'}</svg>`;
const S={step:'ask',q:'',topic:'general',miss:0,n:0,shared:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const STEPS=[['ask','稟告'],['jiao','擲筊'],['draw','抽籤'],['confirm','確認'],['result','解籤']];
function steps(){const i=STEPS.findIndex(s=>s[0]===S.step);$('#qsteps').innerHTML=STEPS.map((s,k)=>`<span class="${k===i?'on':k<i?'done':''}">${s[1]}</span>`).join('')}
function render(){steps();({ask:vAsk,jiao:vJiao,draw:vDraw,confirm:vJiao,result:vResult})[S.step]();}
function go(s){S.step=s;render();window.scrollTo({top:0,behavior:'smooth'})}

function vAsk(){
  $('#stage').innerHTML=`<div class="q-lab">在心裡說出你的名字，和想問的事</div>
  <textarea id="qq" rows="2" maxlength="80" placeholder="例如：我這次換工作會順利嗎？（可留白）">${esc(S.q)}</textarea>
  <div class="dg-topics" role="group" aria-label="想問哪方面" style="align-self:stretch"><span>想問哪方面</span>${Object.entries(TOPICS).map(([k,v])=>`<button type="button" data-t="${k}" aria-pressed="${S.topic===k}">${v}</button>`).join('')}</div>
  <p class="q-note">求籤一次問一件事就好，問得越具體，籤詩越好對照。</p>
  <button class="q-btn" id="toJiao">準備好了，擲筊請示</button>`;
  $('#qq').addEventListener('input',e=>S.q=e.target.value);
  $('#toJiao').onclick=()=>{S.miss=0;go('jiao')};
}
function vJiao(){
  const confirm=S.step==='confirm';
  $('#stage').innerHTML=`${confirm?`<div class="q-num">抽到第${cnum(S.n)}籤</div><p class="q-note">再擲一次筊，請示是不是這一支。</p>`:`<p class="q-note">${S.q?`「${esc(S.q)}」<br>`:''}請示可不可以求籤。擲到<b>聖筊</b>（一平一凸）就可以抽籤。</p>`}
  <img class="q-toss" src="img/pig-toss.webp" alt="準備擲筊的小豬" width="400" height="409"><div class="jiao" id="jiao">${JIAO_SVG(true)}${JIAO_SVG(false)}</div>
  <div id="jres"></div>
  <div class="q-row" id="jbtns"><button class="q-btn" id="toss">擲筊</button></div>`;
  $('#toss').onclick=toss;
}
function toss(){
  const a=rnd(2),b=rnd(2),j=$('#jiao'),btn=$('#toss');btn.disabled=true;
  j.classList.remove('toss');void j.offsetWidth;j.classList.add('toss');
  setTimeout(()=>{j.innerHTML=JIAO_SVG(!!a)+JIAO_SVG(!!b);},380);
  setTimeout(()=>{
    const kind=a!==b?'聖':a?'笑':'陰';dgT('qian/jiao/'+kind);
    const confirm=S.step==='confirm';
    if(kind==='聖'){
      $('#jres').innerHTML=`<div class="q-res ok"><img class="q-pig" src="img/pig-great.webp" alt="小豬說好棒好棒" width="400" height="406">聖筊<small>${confirm?'就是這一支籤。':'可以求籤了。'}</small></div>`;
      $('#jbtns').innerHTML=confirm?`<button class="q-btn" id="next">看籤詩</button>`:`<button class="q-btn" id="next">去搖籤筒</button>`;
      $('#next').onclick=()=>{if(confirm){dgT('qian/done/'+S.n);dgT('qian/asked/'+S.topic);go('result')}else go('draw')};
    }else{
      S.miss++;
      const msg=kind==='笑'?'笑筊：兩面都是平的。神明笑了，可能是問題還不夠清楚。':'陰筊：兩面都是凸的。代表現在不太適合，或答案是否定的。';
      const extra=confirm?'這支籤不是給你的，放回去重新抽一支。':S.miss>=3?'連續沒擲到聖筊，可以換個問法，或過一會兒再來。':'深呼吸，再想清楚一點，然後再擲一次。';
      $('#jres').innerHTML=`<div class="q-res"><img class="q-pig" src="img/pig-${kind==='笑'?'uh':'no'}.webp" alt="小豬的反應" width="400" height="370">${kind}筊<small>${msg}<br>${extra}</small></div>`;
      $('#jbtns').innerHTML=confirm?`<button class="q-btn" id="next">放回去重抽</button>`:`<button class="q-btn" id="next">再擲一次</button>${S.miss>=3?'<button class="q-btn ghost" id="back">換個問法</button>':''}`;
      $('#next').onclick=()=>confirm?go('draw'):vJiao();
      const bk=$('#back');if(bk)bk.onclick=()=>go('ask');
    }
  },820);
}
function vDraw(){
  const sticks=Array.from({length:11},(_,i)=>`<i style="left:${i*8.2}px;height:${54+((i*37)%14)}px"></i>`).join('');
  $('#stage').innerHTML=`<p class="q-note">心裡想著你的問題，搖一搖籤筒，會有一支籤跳出來。</p>
  <div class="tube" id="tube"><div class="sticks">${sticks}</div><div class="body"></div></div>
  <div id="dres"></div>
  <div class="q-row" id="dbtns"><button class="q-btn" id="shake">搖籤筒</button></div>`;
  $('#shake').onclick=()=>{
    $('#shake').disabled=true;const t=$('#tube');t.classList.add('shake');
    setTimeout(()=>{S.n=rnd(60)+1;t.classList.remove('shake');t.insertAdjacentHTML('beforeend',`<div class="pop">${cnum(S.n)}</div>`);
      $('#dres').innerHTML=`<div class="q-num">第${cnum(S.n)}籤・${GZ[S.n-1]}</div>`;
      $('#dbtns').innerHTML=`<button class="q-btn" id="cf">擲筊確認</button>`;$('#cf').onclick=()=>go('confirm');
    },1150);
  };
}
function shareURL(){const u=new URLSearchParams();u.set('n',S.n);if(S.topic!=='general')u.set('t',S.topic);if(S.q)u.set('q',S.q);return dgBase()+'?'+u.toString()}
function text(){const r=READ[S.n-1];return `【問問小豬・六十甲子籤】${S.q?S.q+'\n':''}第${cnum(S.n)}籤 ${GZ[S.n-1]}（${TONE[r[0]]}）\n${POEM[S.n-1].split('|').join('\n')}\n\n白話：${r[1]}\n感情：${r[2]}\n工作：${r[3]}\n財運：${r[4]}\n小豬想說：${r[5]}\n\n${shareURL()}`}
function vResult(){
  const r=READ[S.n-1],ti={love:2,work:3,money:4}[S.topic]||0;
  const all=[['感情',2],['工作',3],['財運',4]];
  const hl=ti?`<div class="say" style="background:var(--dg-acc-soft)"><b>你問的${TOPICS[S.topic]}：</b>${r[ti]}</div>`:'';
  const asp=all.filter(x=>x[1]!==ti).map(([k,i])=>`<dt>${k}</dt><dd>${r[i]}</dd>`).join('');
  $('#stage').innerHTML=`${S.q?`<p class="q-note">「${esc(S.q)}」</p>`:''}
  <div class="slip"><div class="slip-h"><b>第${cnum(S.n)}籤　${GZ[S.n-1]}</b><span class="tone t${r[0]}">${TONE[r[0]]}・${TONE_TIP[r[0]]}</span></div>
    <div class="poem" lang="zh-Hant">${POEM[S.n-1].split('|').map(l=>`<div>${l}</div>`).join('')}</div></div>
  <div class="read">
    <h3>白話</h3><p>${r[1]}</p>
    <h3>${ti?'放到你的問題上':'各方面'}</h3>${hl}<dl class="asp">${asp}</dl>
    <div class="say"><img class="slip-pig" src="img/pig-${['happy','cheer','pat'][r[0]]}.webp" alt="" width="400" height="392"><b>小豬想說：</b>${r[5]}</div>
    <p class="src">籤詩原文為傳統六十甲子籤；白話、傾向與建議是小豬的解讀，各宮廟的說法可能不同。</p>
  </div>
  <div class="q-row"><button class="q-btn" id="share">分享結果連結</button><button class="q-btn ghost" id="copy">複製籤詩</button></div>
  <button class="q-link" id="again">再求一支籤</button>`;
  if(S.shared){S.shared=false;dgSharedBanner($('#stage'),dgBase())}
  $('#share').onclick=e=>dgShare(shareURL(),'我抽到的籤｜問問小豬',e.currentTarget);
  $('#copy').onclick=e=>{const t=text();try{navigator.clipboard.writeText(t).then(()=>dgToast('已複製籤詩'),()=>dgToast('這個瀏覽器不能複製，請截圖保存'))}catch(err){dgToast('這個瀏覽器不能複製，請截圖保存')}};
  $('#again').onclick=()=>go('ask');
}
document.addEventListener('click',e=>{const b=e.target.closest('.dg-topics button');if(!b)return;S.topic=b.dataset.t;document.querySelectorAll('.dg-topics button').forEach(x=>x.setAttribute('aria-pressed',x===b))});

/* ---- 問問小豬: share links + stats ---- */
const dgT=p=>{try{window.dgTrack&&window.dgTrack(p)}catch(e){}};
function dgToast(m){let t=document.querySelector('.dg-toast');if(!t){t=document.createElement('div');t.className='dg-toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2000)}
function dgBase(){return location.href.split('#')[0].split('?')[0]}
function dgShare(url,title,anchor){
  dgT(location.pathname.replace(/^.*\//,'').replace('.html','')+'/share');
  if(navigator.share){navigator.share({title:title,text:title,url:url}).catch(()=>{});return}
  const fb=()=>{if(!anchor)return;let b=anchor.parentElement.querySelector('.dg-copy');if(!b){b=document.createElement('textarea');b.className='dg-copy';b.readOnly=true;b.rows=3;anchor.parentElement.after(b)}b.value=url;b.focus();b.select();dgToast('長按連結複製')};
  try{navigator.clipboard.writeText(url).then(()=>dgToast('已複製連結，貼給朋友吧'),fb)}catch(e){fb()}
}
function dgSharedBanner(el,again){el.insertAdjacentHTML('afterbegin',`<div class="dg-shared"><span>這是朋友分享給你的結果</span><a href="${again}">換我抽一次 →</a></div>`)}

(function(){const P=new URLSearchParams(location.search),n=+P.get('n');
  if(n>=1&&n<=60){S.n=n;S.topic=TOPICS[P.get('t')]?P.get('t'):'general';S.q=P.get('q')||'';S.shared=true;S.step='result';dgT('qian/opened-share')}
  render();
})();
</script>
